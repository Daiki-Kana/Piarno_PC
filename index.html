<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maracas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- メイン映像コンテナ（ビデオとCanvasを自然比率で完全重畳） -->
      <div class="video-container">
        <video id="webcam" class="mirrored" playsinline autoplay muted></video>
        <canvas id="output-canvas" class="mirrored"></canvas>
      </div>

      <!-- 左上：テレメトリピル（?debug=1 時のみ表示） -->
      <div id="pc-telemetry-pill" class="pc-telemetry-pill hidden" aria-label="Performance Telemetry">
        <span id="telemetry-cam-fps" class="telemetry-item telemetry-fps">CAM --</span>
        <span class="telemetry-sep">/</span>
        <span id="telemetry-app-fps" class="telemetry-item telemetry-fps">APP -- FPS</span>
        <span class="telemetry-sep">/</span>
        <span id="telemetry-res" class="telemetry-item">--×--</span>
        <span class="telemetry-sep">/</span>
        <span id="telemetry-ms" class="telemetry-item">-- ms</span>
        <span class="telemetry-sep">/</span>
        <span id="telemetry-mode" class="telemetry-item telemetry-mode">IDLE</span>
        <span class="telemetry-sep">/</span>
        <span id="telemetry-engine" class="telemetry-item telemetry-mode">--</span>
      </div>

      <!-- 画面右上コントロール群（カメラ選択・鏡像切替・1 Euro Filter・トラッキング表示） -->
      <div class="top-right-controls">
        <!-- Webカメラデバイス選択 -->
        <div class="ctrl-menu-container">
          <button id="camera-select-btn" class="ctrl-circle-btn" aria-label="Select Camera" title="Select Camera">
            <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
              <rect x="3" y="7" width="13" height="10" rx="2" class="icon-line" />
              <polygon points="16,10 21,7.5 21,16.5 16,14" class="icon-line" />
            </svg>
          </button>
          <div id="camera-select-menu" class="popup-menu hidden">
            <div class="popup-menu-header">CAMERA</div>
            <div id="camera-list" class="camera-list"></div>
          </div>
        </div>

        <!-- 鏡像（左右反転）切替 -->
        <button id="mirror-toggle-btn" class="ctrl-circle-btn" aria-label="Toggle Mirror" title="Mirror: ON" aria-pressed="true">
          <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
            <line x1="12" y1="4" x2="12" y2="20" class="icon-line" />
            <polygon points="4,8 9,12 4,16" class="icon-line" />
            <polygon points="20,8 15,12 20,16" class="icon-line" />
          </svg>
        </button>

        <!-- トラッキングエンジン切替（MediaPipe ⇔ MicroPose） -->
        <button id="engine-toggle-btn" class="ctrl-circle-btn off" aria-label="Switch Tracking Engine" title="Engine: MP-GPU" aria-pressed="false">
          <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" class="icon-line" />
            <line x1="9" y1="3" x2="9" y2="7" class="icon-line" />
            <line x1="15" y1="3" x2="15" y2="7" class="icon-line" />
            <line x1="9" y1="17" x2="9" y2="21" class="icon-line" />
            <line x1="15" y1="17" x2="15" y2="21" class="icon-line" />
            <line x1="3" y1="9" x2="7" y2="9" class="icon-line" />
            <line x1="3" y1="15" x2="7" y2="15" class="icon-line" />
            <line x1="17" y1="9" x2="21" y2="9" class="icon-line" />
            <line x1="17" y1="15" x2="21" y2="15" class="icon-line" />
          </svg>
        </button>

        <!-- トラッキングライン表示切替 -->
        <button id="tracking-line-toggle-btn" class="ctrl-circle-btn toggle-slash-btn" aria-label="Toggle Tracking Lines" title="Tracking Lines: ON" aria-pressed="true">
          <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
            <path class="icon-line" d="M 4,19 L 10,13 L 14,16 L 20,5" />
            <circle cx="4" cy="19" r="2" class="icon-dot" />
            <circle cx="10" cy="13" r="2" class="icon-dot" />
            <circle cx="14" cy="16" r="2" class="icon-dot" />
            <circle cx="20" cy="5" r="2.5" class="icon-dot" />
            <line x1="3" y1="21" x2="21" y2="3" class="slash-line" />
          </svg>
        </button>
      </div>

      <!-- カメラエラーオーバーレイ（白黒・ボーダーレス・英語UI） -->
      <div id="camera-error-overlay" class="camera-error-overlay hidden">
        <div class="camera-error-modal">
          <button id="camera-error-close-btn" class="modal-close-icon-btn" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18" class="icon-line" />
              <line x1="18" y1="6" x2="6" y2="18" class="icon-line" />
            </svg>
          </button>
          <div class="camera-error-badge">CAMERA ERROR</div>
          <div id="camera-error-title" class="camera-error-title">Camera Unavailable</div>
          <p id="camera-error-message" class="camera-error-message">
            Camera access was denied or no webcam was found.
          </p>
          <div class="camera-error-actions">
            <button id="camera-error-reload-btn" class="camera-error-btn" aria-label="Reload" title="Reload">
              <svg viewBox="0 0 24 24" class="btn-icon" aria-hidden="true">
                <path d="M 4,12 A 8,8 0 1,1 7,18.2" class="icon-line" />
                <polyline points="4,7 4,12 9,12" class="icon-line" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 起動時：スタートモーダル（白黒・ボーダーレス・英語UI） -->
      <div id="start-modal" class="start-modal">
        <div class="start-card">
          <button id="start-play-btn" class="start-play-btn" aria-label="Start">
            <span id="start-play-text">START</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
